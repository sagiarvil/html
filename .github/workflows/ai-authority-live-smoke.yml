name: ai-authority-live-smoke

on:
  workflow_run:
    workflows: [firebase-production]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-authority-production-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify AI search visibility positioning, CTAs and authority routes
        shell: bash
        run: |
          set -euo pipefail
          check(){ url="$1"; marker="$2"; body="$(curl -fLsS --connect-timeout 8 --max-time 25 "$url")"; grep -Fq "$marker" <<<"$body"; echo "AI_AUTHORITY_SMOKE_OK: $url"; }
          check 'https://htmlandhtml.com/' 'Yapay Zeka Sizi Buluyor mu?'
          check 'https://htmlandhtml.com/' 'Tavsiye Edilmeye Hazır mısınız?'
          check 'https://htmlandhtml.com/tr/araclar/' 'data-premium-infographic="scope-map"'
          check 'https://htmlandhtml.com/tr/ai-website-readiness/' 'GEO + AEO + LLMO + AAO + RAG + E-E-A-T + llms.txt + sitemap'
          check 'https://htmlandhtml.com/tr/llms-txt-validator/' 'llms.txt Dosyanız Yapay Zeka İçin Gerçekten Kullanılabilir mi?'
          check 'https://htmlandhtml.com/tr/rehberler/llms-txt/' 'llms.txt Nedir? Yapay Zeka İçin Makine Okunabilir İçerik Haritası Nasıl Kurulur?'
          check 'https://htmlandhtml.com/tr/ai-crawler-checker/' 'ChatGPT ve Diğer Yapay Zeka Tarayıcıları Sitenize Ulaşabiliyor mu?'
          check 'https://htmlandhtml.com/tr/ai-mention-tracker/' 'Yapay Zeka Cevaplarında Markanız Gerçekten Geçiyor mu?'
          check 'https://htmlandhtml.com/tr/yapay-zeka-arama-gorunurlugu/' 'Müşteriniz yapay zekaya'
          check 'https://htmlandhtml.com/tr/geo-optimizasyon/' 'GEO'
          check 'https://htmlandhtml.com/tr/aeo-answer-engine/' 'AEO'
          check 'https://htmlandhtml.com/tr/llmo-optimizasyon/' 'LLMO'
          check 'https://htmlandhtml.com/tr/aao-ajent-optimizasyon/' 'AAO'
          check 'https://htmlandhtml.com/tr/rag-optimizasyon/' 'RAG'
          check 'https://htmlandhtml.com/tr/e-e-a-t-guven-sinyalleri/' 'E-E-A-T'
          check 'https://htmlandhtml.com/en/ai-search-visibility/' 'When a customer asks AI'
          tr_glossary="$(curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/tr/sozluk/)"
          en_glossary="$(curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/en/glossary/)"
          ! grep -Fq 'Google doğruluk sınırı' <<<"$tr_glossary"
          ! grep -Fq 'Google accuracy boundary' <<<"$en_glossary"
      - name: Verify machine-readable discovery surfaces include authority graph
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/sitemap.xml -o /tmp/sitemap.xml
          curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/sitemap-news.xml -o /tmp/sitemap-news.xml
          curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/robots.txt -o /tmp/robots.txt
          curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/llms.txt -o /tmp/llms.txt
          grep -Fq 'https://htmlandhtml.com/tr/sozluk/' /tmp/sitemap.xml
          grep -Fq 'https://htmlandhtml.com/en/glossary/' /tmp/sitemap.xml
          grep -Fq 'https://htmlandhtml.com/tr/geo-optimizasyon/' /tmp/sitemap.xml
          grep -Fq 'https://htmlandhtml.com/tr/sozluk/' /tmp/llms.txt
          grep -Fq 'xmlns:news="http://www.google.com/schemas/sitemap-news/0.9"' /tmp/sitemap-news.xml
          grep -Fq 'Sitemap: https://htmlandhtml.com/sitemap-news.xml' /tmp/robots.txt

          # sed consumes the complete grep stream; unlike `head -n 1` it cannot SIGPIPE grep under pipefail.
          article_url="$(grep -oE 'https://htmlandhtml\.com/tr/llms-txt-haberler/[a-z0-9-]+/' /tmp/sitemap.xml | sed -n '1p')"
          test -n "$article_url"
          curl -fLsS --connect-timeout 8 --max-time 25 "$article_url" -o /tmp/news-article.html
          grep -Fq '"@type":"NewsArticle"' /tmp/news-article.html
          grep -Fq '"datePublished"' /tmp/news-article.html
          grep -Fq '"dateModified"' /tmp/news-article.html
          grep -Fq '"headline"' /tmp/news-article.html
          grep -Fq '"author":[{"@type":"Person"' /tmp/news-article.html
          grep -Fq '"name":"Barış Bağırlar"' /tmp/news-article.html
          grep -Fq '"url":"https://www.linkedin.com/in/barisbagirlar/"' /tmp/news-article.html
          grep -Fq '"sameAs":["https://www.linkedin.com/in/barisbagirlar/"]' /tmp/news-article.html
          grep -Fq 'name="author" content="Barış Bağırlar"' /tmp/news-article.html
          grep -Fq 'class="news-author"' /tmp/news-article.html
          grep -Fq '"publisher":{"@type":"Organization"' /tmp/news-article.html
          grep -Fq '"url":"https://htmlandhtml.com/about/"' /tmp/news-article.html
          grep -Fq -- '-16x9.svg' /tmp/news-article.html
          grep -Fq -- '-4x3.svg' /tmp/news-article.html
          grep -Fq -- '-1x1.svg' /tmp/news-article.html
          echo "NEWSARTICLE_LIVE_SMOKE_OK: $article_url"
          echo 'AI_AUTHORITY_MACHINE_GRAPH_OK'
