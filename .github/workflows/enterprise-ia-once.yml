name: enterprise-ia-once
on:
  push:
    branches: [enterprise-global-ia-20260906]
permissions:
  contents: write
jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', 'Generate enterprise global IA') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: enterprise-global-ia-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate enterprise information architecture
        run: node scripts/build-enterprise-ia.mjs
      - name: Validate generated contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit generated IA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/enterprise-ia-once.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'Generate enterprise global IA'
          git push origin HEAD:enterprise-global-ia-20260906
