name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Static product integrity
        run: npm test
      - name: Install Firebase runtime dependencies
        working-directory: firebase-functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile canonical Firebase API runtime
        working-directory: firebase-functions
        run: npm run build
      - name: Validate Firebase entrypoint syntax
        run: node --check firebase-functions/index.js
      - name: Bundle formal llms engine for deterministic fixture tests
        working-directory: firebase-functions
        run: npm run build:test-llms
      - name: Run llms.txt v2 fixture tests
        run: node tests/llms/check.mjs
