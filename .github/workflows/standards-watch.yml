name: standards-watch

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authoritative upstream sources
        id: watch
        continue-on-error: true
        run: node scripts/standards-watch.mjs
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: standards-watch-report
          path: standards-watch-report.json
          retention-days: 30
      - name: Open or update review issue when drift is detected
        if: steps.watch.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('standards-watch-report.json','utf8'));
            const title = 'Standards registry review required';
            const lines = report.checks.filter(x => x.status !== 'ok').map(x => `- **${x.id}**: HTTP ${x.httpStatus}; missing markers: ${(x.missingMarkers||[]).join(', ') || 'none'}${x.observedVersion ? `; observed=${x.observedVersion}` : ''}${x.expectedVersion ? `; expected=${x.expectedVersion}` : ''}${x.error ? `; error=${x.error}` : ''}`);
            const body = [
              'Automated upstream drift detection found a change or unverifiable official source.',
              '',
              `Registry: ${report.registryVersion}`,
              `llms rules: ${report.llmsRuleSet}`,
              `Observed: ${report.generatedAt}`,
              '',
              ...lines,
              '',
              'Do not silently update production scoring. Verify the source, update the versioned registry/rules, add regression tests, then close this issue.'
            ].join('\n');
            const q = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state:'open', labels:'standards-drift'}).catch(()=>({data:[]}));
            const existing = q.data.find(i => i.title === title);
            if(existing){
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            }else{
              try{await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['standards-drift']});}
              catch{await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});}
            }
      - name: Fail release signal on drift
        if: steps.watch.outcome == 'failure'
        run: exit 1
