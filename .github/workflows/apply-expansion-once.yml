name: apply-expansion-once

on:
  push:
    branches: [ai-mention-dark-deep50-20260906-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply generated expansion changes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ai-mention-dark-deep50-20260906-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-expansion.mjs
      - name: Commit deterministic generated changes
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply generated expansion changes'
          git push origin HEAD:ai-mention-dark-deep50-20260906-final
