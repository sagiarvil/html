name: llms-txt-news

on:
  schedule:
    # Turkey uses UTC+3 year-round: 00:00 UTC = 03:00 Europe/Istanbul.
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_llms_news.py'
      - 'scripts/enhance_llms_news_seo.py'
      - 'scripts/news_svg_generator.py'
      - 'data/llms-news.json'
      - '.github/workflows/llms-news.yml'

permissions:
  contents: write

concurrency:
  group: htmlandhtml-llms-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and editorialize relevant AI Search updates
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_EDITORIAL_OPENAI_KEY: ${{ secrets.NEWS_EDITORIAL_OPENAI_KEY }}
          NEWS_EDITORIAL_MODEL: gemini-3.5-flash-lite
        run: python3 scripts/update_llms_news.py
      - name: Detect validated editorial change
        id: editorial
        shell: bash
        run: |
          if git diff --quiet -- data/llms-news.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'LLMS_NEWS_NO_EDITORIAL_CHANGE'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize bilingual news pages and Google Article/News discovery
        run: |
          set -euo pipefail
          python3 scripts/build_llms_news.py
          python3 scripts/enhance_llms_news_seo.py
      - name: Validate news editorial and SEO contract
        run: node tests/integrity/llms-news.test.mjs
      - name: Detect validated materialized change
        id: materialized
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain -- data/llms-news.json tr/llms-txt-haberler en/llms-txt-news assets/news sitemap.xml sitemap-news.xml robots.txt llms.txt index.md)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'LLMS_NEWS_NO_MATERIALIZED_CHANGE'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit validated update
        if: steps.materialized.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'htmlandhtml-news-bot'
          git config user.email 'htmlandhtml-news-bot@users.noreply.github.com'
          git add data/llms-news.json tr/llms-txt-haberler en/llms-txt-news assets/news sitemap.xml sitemap-news.xml robots.txt llms.txt index.md
          git commit -m 'content: refresh LLMS.TXT News intelligence'
          git push origin HEAD:main
