name: live-smoke

on:
  workflow_run:
    workflows: [firebase-production]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production homepage and authority routes
        shell: bash
        run: |
          set -euo pipefail
          check(){
            url="$1"; marker="$2"; body="$(curl -fsS --connect-timeout 8 --max-time 25 "$url")"; printf '%s' "$body" | grep -qi "$marker"
          }
          check 'https://htmlandhtml.com/' 'Website Fix Validator'
          check 'https://htmlandhtml.com/tr/llms-txt-validator/' 'LLMS.TXT VALIDATOR'
          check 'https://htmlandhtml.com/en/ai-crawler-checker/' 'AI CRAWLER ACCESS CHECKER'
          check 'https://htmlandhtml.com/en/ai-website-readiness/' 'AI WEBSITE READINESS'
          check 'https://htmlandhtml.com/methodology.html' 'PUBLIC METHODOLOGY'
          check 'https://htmlandhtml.com/about/' 'ABOUT HTML&HTML'
          check 'https://htmlandhtml.com/contact/' 'CONTACT / SUPPORT'
          check 'https://htmlandhtml.com/privacy/' 'PRIVACY / PUBLIC SCANS'
          check 'https://htmlandhtml.com/terms/' 'TERMS / PUBLIC VALIDATOR'
          body="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/)"
          ! printf '%s' "$body" | grep -q '\$49\|\$99'
          printf '%s' "$body" | grep -q '\$149'

      - name: Verify machine-readable authority graph
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/llms.txt | grep -q 'OpenAPI contract'
          curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/index.md | grep -q 'Authority tools'
          curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/sitemap.xml | grep -q '/tr/llms-txt-validator/'
          body="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/openapi.json)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          if(x.openapi!=='3.1.0') throw new Error('OpenAPI version');
          for(const p of ['/api/health','/api/scan','/api/mandate']) if(!x.paths?.[p]) throw new Error('missing API path '+p);
          NODE

      - name: Verify health contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/api/health)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          if(x.status!=='ok') throw new Error('health status');
          if(x.scanEngines!==12) throw new Error('engine count');
          if(x.freeDiagnosis!==true) throw new Error('free diagnosis contract');
          NODE

      - name: Verify production 12-engine scan
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 120 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/scan)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          const expected=['crawl','technical','ai','llms','schema','performance','accessibility','security','trust','agent','conversion','links'];
          for(const k of expected) if(typeof x.scores?.[k] !== 'number') throw new Error('missing score '+k);
          if(!Array.isArray(x.findings)) throw new Error('findings missing');
          if(!x.scanId) throw new Error('scan id missing');
          if(x.fieldData?.coreWebVitals!=='NOT_MEASURED') throw new Error('CWV evidence contract');
          if(Object.keys(x.scores).length!==12) throw new Error('score cardinality');
          for(const f of x.findings){
            if(!f.id||!f.severity||!f.confidence||!f.sourceClass||!('evidence' in f)) throw new Error('finding evidence contract');
            if('fixTr' in f||'fixEn' in f||'rootFix' in f) throw new Error('paid remediation leaked into free scan');
          }
          NODE

      - name: Verify SSRF boundary repeats safely
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/ssrf.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"domain":"http://127.0.0.1"}' https://htmlandhtml.com/api/scan)"
          test "$code" = '403'
          code2="$(curl -sS -o /tmp/ssrf2.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"domain":"http://localhost"}' https://htmlandhtml.com/api/scan)"
          test "$code2" = '403'

      - name: Verify paid mandate is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/mandate.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/mandate)"
          case "$code" in
            402|503) exit 0 ;;
            *) echo "Unexpected paid endpoint status: $code"; cat /tmp/mandate.json; exit 1 ;;
          esac
