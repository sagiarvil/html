name: live-smoke

on:
  workflow_run:
    workflows: [firebase-production]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production routes and V3 customer experience
        shell: bash
        run: |
          set -euo pipefail
          check(){ url="$1"; marker="$2"; body="$(curl -fLsS --connect-timeout 8 --max-time 25 "$url")"; if ! grep -Fqi "$marker" <<<"$body"; then echo "SMOKE_MARKER_MISSING: $marker @ $url"; exit 1; fi; echo "SMOKE_OK: $url"; }
          check 'https://htmlandhtml.com/' 'Yapay Zeka SEO Analizi ve ChatGPT Görünürlük Testi'
          check 'https://htmlandhtml.com/tr/' 'Web Siteniz ChatGPT ve Yapay Zeka Aramalarında Görünüyor mu?'
          check 'https://htmlandhtml.com/en/' 'AI SEO Audit &amp; ChatGPT Visibility Test'
          check 'https://htmlandhtml.com/tr/araclar/' 'data-premium-infographic="scope-map"'
          check 'https://htmlandhtml.com/tr/fiyatlandirma/' 'AI SEO Uygulama Paketi $99'
          check 'https://htmlandhtml.com/en/pricing/' 'AI SEO Implementation Pack $99'
          check 'https://htmlandhtml.com/en/website-scanner/' '18-engine WEBSITE SCANNER'
          check 'https://htmlandhtml.com/tr/site-tarama/' '18 Motor'
          check 'https://htmlandhtml.com/tr/llms-txt-validator/' 'llms.txt Validator ve Yapay Zeka Site Testi'
          check 'https://htmlandhtml.com/tr/ai-crawler-checker/' 'ChatGPT Bot ve AI Crawler Erişim Testi'
          check 'https://htmlandhtml.com/en/ai-crawler-checker/' 'ChatGPT Bot &amp; AI Crawler Access Checker'
          check 'https://htmlandhtml.com/tr/ai-website-readiness/' 'Yapay Zeka SEO Analizi ve AI Web Sitesi Hazırlık Testi'
          check 'https://htmlandhtml.com/en/ai-website-readiness/' 'AI Website Readiness &amp; AI SEO Audit'
          check 'https://htmlandhtml.com/tr/ai-mention-tracker/' 'AI MARKA GÖRÜNÜRLÜK TAKİBİ'
          check 'https://htmlandhtml.com/en/ai-mention-tracker/' 'AI MENTION TRACKER'
          body="$(curl -fLsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/)"
          ! grep -Eq '\$49|\$149' <<<"$body"
          ! grep -Eq 'Engine V2|120 (deep )?(checks|controls)|43[- ]page|22[- ]file|15[- ]prompt' <<<"$body"
          grep -Fq '$99' <<<"$body"
          grep -Fq 'v3-capability-contract' <<<"$body"
          grep -Fq '18 Engine V3' <<<"$body"
          grep -Fq '105' <<<"$body"
          grep -Fq '/assets/css/premium-experience.css' <<<"$body"
          grep -Fq '/assets/js/theme.js' <<<"$body"

      - name: Verify Enterprise Analyzer locale purity and parity
        shell: bash
        run: |
          set -euo pipefail
          en_url='https://htmlandhtml.com/enterprise-analyzer/htmlandhtml-ai-report'
          tr_url='https://htmlandhtml.com/tr/enterprise-analyzer/htmlandhtml-ai-report'
          curl -fLsS --connect-timeout 8 --max-time 30 "$en_url" -o /tmp/ea-en.html
          curl -fLsS --connect-timeout 8 --max-time 30 "$tr_url" -o /tmp/ea-tr.html
          grep -Fq '<html lang="en"' /tmp/ea-en.html
          grep -Fq '<html lang="tr"' /tmp/ea-tr.html
          grep -Fq 'Live Sample AI Visibility Report' /tmp/ea-en.html
          grep -Fq 'Canlı Örnek Yapay Zeka Görünürlük Raporu' /tmp/ea-tr.html
          grep -Fq 'EA_LOCALE_CONTRACT:en:URL_SSOT' /tmp/ea-en.html
          grep -Fq 'EA_LOCALE_CONTRACT:tr:URL_SSOT' /tmp/ea-tr.html
          grep -Fq 'hreflang="en" href="https://htmlandhtml.com/enterprise-analyzer/htmlandhtml-ai-report"' /tmp/ea-en.html
          grep -Fq 'hreflang="tr" href="https://htmlandhtml.com/tr/enterprise-analyzer/htmlandhtml-ai-report"' /tmp/ea-en.html
          ! grep -Eq 'Ücretsiz|Çözümler|Haberler|Sözlük|Onarım|Hedef:|Ağırlık:|Tamamlandı' /tmp/ea-en.html
          EN_FILE=/tmp/ea-en.html TR_FILE=/tmp/ea-tr.html node - <<'NODE'
          const fs=require('fs');
          const en=fs.readFileSync(process.env.EN_FILE,'utf8'), tr=fs.readFileSync(process.env.TR_FILE,'utf8');
          const ids=s=>[...s.matchAll(/class="ea-engine-id"[^>]*>\s*(ENG-\d{2})\s*</g)].map(x=>x[1]);
          const scores=s=>[...s.matchAll(/class="ea-engine-score-val"[^>]*>\s*(\d+)%\s*</g)].map(x=>Number(x[1]));
          const findings=s=>(s.match(/class="[^"]*finding-card\b/g)||[]).length;
          if(JSON.stringify(ids(en))!==JSON.stringify(ids(tr))) throw new Error('EN/TR engine ID parity');
          if(JSON.stringify(scores(en))!==JSON.stringify(scores(tr))) throw new Error('EN/TR engine score parity');
          if(findings(en)!==findings(tr)) throw new Error('EN/TR finding-count parity');
          NODE

      - name: Verify SEO metadata and evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          tr_home="$(curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/tr/)"
          en_home="$(curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/en/)"
          tr_glossary="$(curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/tr/sozluk/)"
          en_glossary="$(curl -fLsS --connect-timeout 8 --max-time 25 https://htmlandhtml.com/en/glossary/)"
          grep -Fq 'Yapay Zeka SEO Analizi ve ChatGPT Görünürlük Testi' <<<"$tr_home"
          grep -Fq 'AI SEO Audit &amp; ChatGPT Visibility Test' <<<"$en_home"
          grep -Fq 'Ücretsiz Kontrol Et' <<<"$tr_home"
          grep -Fq 'Check Free' <<<"$en_home"
          grep -Fq 'Ranking, trafik veya AI citation garantisi değildir' <<<"$tr_home"
          grep -Fq 'It is not a ranking, traffic or AI citation guarantee' <<<"$en_home"
          ! grep -Fq 'Google doğruluk sınırı' <<<"$tr_glossary"
          ! grep -Fq 'Google accuracy boundary' <<<"$en_glossary"

      - name: Verify machine-readable authority graph
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/llms.txt -o /tmp/htmlandhtml-llms.txt
          curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/index.md -o /tmp/htmlandhtml-index.md
          curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/sitemap.xml -o /tmp/htmlandhtml-sitemap.xml
          grep -Fq 'AI Mention Tracker' /tmp/htmlandhtml-llms.txt
          grep -Fq 'AI Mention Tracker' /tmp/htmlandhtml-index.md
          grep -Fq '/tr/ai-mention-tracker/' /tmp/htmlandhtml-sitemap.xml
          openapi="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/openapi.json)"
          profile="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/audit-profile.json)"
          sources="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/sources.json)"
          OPENAPI="$openapi" PROFILE="$profile" SOURCES="$sources" node - <<'NODE'
          const api=JSON.parse(process.env.OPENAPI), p=JSON.parse(process.env.PROFILE), s=JSON.parse(process.env.SOURCES);
          if(api.openapi!=='3.1.0') throw new Error('OpenAPI version');
          for(const x of ['/api/health','/api/scan','/api/intelligence','/api/mentions','/api/mandate']) if(!api.paths?.[x]) throw new Error('missing API path '+x);
          if(p.version!=='3.0.0'||p.engines?.length!==12) throw new Error('audit profile compatibility contract');
          if(p.engineContract?.name!=='Engine V3 Deterministic Chain'||p.engineContract?.moduleCount!==18||p.engineContract?.controlCount!==105) throw new Error('V3 engine contract');
          if(p.intelligenceLayer?.analysisCount!==13||p.intelligenceLayer?.readinessLensCount!==7) throw new Error('intelligence profile contract');
          if(p.scanBoundaries?.maxPublicHtmlPages!==50||p.scanBoundaries?.maxLinkProbes!==30) throw new Error('scan boundary');
          if(p.engines.reduce((a,x)=>a+x.overallWeight,0)!==100) throw new Error('compatibility score weights');
          if(p.executionContract?.neutralQueryMaximum!==3||p.executionContract?.providerMaximum!==3||p.executionContract?.maximumObservationsPerRun!==9) throw new Error('AI mention measurement boundary');
          if(p.machineSurfaceContract?.maxPageLevelMarkdownManifests!==30) throw new Error('machine surface boundary');
          if(!Array.isArray(s.sources)||s.sources.length<8) throw new Error('source registry contract');
          NODE

      - name: Verify health contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/api/health)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          if(x.status!=='ok'||(x.scanEngines!==18&&x.scanEngines!==12)||x.intelligenceAnalyses!==13||x.readinessLenses!==7||x.maxPages!==50||x.freeDiagnosis!==true||x.fullSiteFixMandatePriceUsd!==99||x.aiMentionTracker!==true) throw new Error('health contract');
          NODE

      - name: Verify production scan and Intelligence Audit contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 240 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/scan)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY); const expected=['crawl','technical','ai','llms','schema','performance','accessibility','security','trust','agent','conversion','links'];
          for(const k of expected) if(typeof x.scores?.[k] !== 'number') throw new Error('missing score '+k);
          if(!Array.isArray(x.findings)||!x.scanId||x.fieldData?.coreWebVitals!=='NOT_MEASURED'||Object.keys(x.scores).length!==12) throw new Error('scan compatibility contract');
          if((x.summary?.pagesScanned||0)>50) throw new Error('Deep Crawl exceeded 50-page boundary');
          const i=x.intelligence;
          if(i?.classification!=='NON_SCORING_INTELLIGENCE_LAYER'||i.coreScoreUnchanged!==true||i.analyses?.length!==13||Object.keys(i.readinessLenses||{}).length!==7) throw new Error('intelligence contract');
          if(i.coreOverall!==x.overall) throw new Error('intelligence mutated core score');
          const rp=i.analyses.find(a=>a.key==='render_parity'); if(rp?.status!=='NOT_MEASURED') throw new Error('render parity fabricated');
          const cb=i.analyses.find(a=>a.key==='codebase_seo_governance'); if(cb?.status!=='REQUIRES_CONTEXT') throw new Error('codebase governance fabricated');
          const ig=i.analyses.find(a=>a.key==='information_gain'); if(!ig||ig.sourceClass!=='INTERNAL_HEURISTIC') throw new Error('information gain boundary');
          for(const f of x.findings){ if(!f.id||!f.severity||!f.confidence||!f.sourceClass||!('evidence' in f)) throw new Error('finding evidence contract'); if('fixTr' in f||'fixEn' in f||'rootFix' in f) throw new Error('paid remediation leaked'); }
          NODE

      - name: Verify dedicated intelligence endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 240 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/intelligence)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY); if(x.intelligence?.analyses?.length!==13||Object.keys(x.intelligence?.readinessLenses||{}).length!==7) throw new Error('dedicated intelligence endpoint');
          NODE

      - name: Verify SSRF boundary repeats safely
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in scan intelligence; do
            for target in 'http://127.0.0.1' 'http://localhost'; do
              code="$(curl -sS -o /tmp/ssrf.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data "{\"domain\":\"$target\"}" "https://htmlandhtml.com/api/$endpoint")"
              test "$code" = '403'
            done
          done

      - name: Verify AI Mention Tracker paid boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/api/mentions)"
          STATUS="$status" node - <<'NODE'
          const x=JSON.parse(process.env.STATUS); if(x.service!=='htmlandhtml-ai-mention-tracker'||x.paidModule!==true||!x.providers) throw new Error('mention tracker status contract');
          NODE
          code="$(curl -sS -o /tmp/mentions.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"brand":"HTML&HTML","domain":"htmlandhtml.com","queries":["Which tools audit websites for AI search readiness?"]}' https://htmlandhtml.com/api/mentions)"
          case "$code" in 402|503) exit 0 ;; *) echo "Unexpected mention endpoint status: $code"; cat /tmp/mentions.json; exit 1 ;; esac

      - name: Verify paid mandate is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/mandate.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/mandate)"
          case "$code" in 402|503) exit 0 ;; *) echo "Unexpected paid endpoint status: $code"; cat /tmp/mandate.json; exit 1 ;; esac
