name: live-smoke

on:
  workflow_run:
    workflows: [firebase-production]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production locale hubs and intent architecture
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/root -D /tmp/root.headers -w '%{http_code}' --connect-timeout 8 --max-time 20 https://htmlandhtml.com/)"
          test "$code" = '301'
          grep -Eqi '^location: .*\/en([[:space:]]|$)' /tmp/root.headers
          check(){
            url="$1"; marker="$2"
            body="$(curl -fLsS --connect-timeout 8 --max-time 25 "$url")"
            if ! printf '%s' "$body" | grep -Fqi "$marker"; then
              echo "SMOKE_MARKER_MISSING: $marker @ $url"
              exit 1
            fi
            echo "SMOKE_OK: $url"
          }
          check 'https://htmlandhtml.com/en' 'WEBSITE AI READINESS / EVIDENCE-FIRST'
          check 'https://htmlandhtml.com/tr' 'AI WEB SİTESİ HAZIRLIĞI / KANIT ÖNCELİKLİ'
          check 'https://htmlandhtml.com/en/tools' 'TOOL DIRECTORY / ONE ENGINE'
          check 'https://htmlandhtml.com/tr/araclar' 'ARAÇ DİZİNİ / TEK MOTOR'
          check 'https://htmlandhtml.com/en/schema-validator' 'FOCUSED FREE TOOL / ONE CANONICAL ENGINE'
          check 'https://htmlandhtml.com/tr/schema-validator' 'ODAKLI ÜCRETSİZ ARAÇ / TEK CANONICAL MOTOR'
          check 'https://htmlandhtml.com/en/guides/ai-crawler-access' 'GUIDE / SOURCED DECISION SUPPORT'
          check 'https://htmlandhtml.com/tr/rehberler/ai-tarayici-erisimi' 'REHBER / KAYNAKLI KARAR DESTEĞİ'
          check 'https://htmlandhtml.com/en/llms-txt-validator' 'LLMS.TXT VALIDATOR'
          check 'https://htmlandhtml.com/tr/ai-crawler-checker' 'AI CRAWLER ACCESS CHECKER'
          check 'https://htmlandhtml.com/en/ai-mention-tracker' 'AI MENTION TRACKER'
          check 'https://htmlandhtml.com/tr/ai-mention-tracker' 'AI MENTION TRACKER'
          check 'https://htmlandhtml.com/en/fix-mandate' 'FULL SITE FIX MANDATE / $149'
          check 'https://htmlandhtml.com/tr/fix-mandate' 'FULL SITE FIX MANDATE / $149'
          check 'https://htmlandhtml.com/en/methodology' 'PUBLIC METHODOLOGY'
          check 'https://htmlandhtml.com/tr/methodology' 'KAMUYA AÇIK METODOLOJİ'
          check 'https://htmlandhtml.com/en/evidence-standard' 'OPEN PRODUCT PROFILE / V1.1'
          check 'https://htmlandhtml.com/tr/kanit-standardi' 'AÇIK ÜRÜN PROFİLİ / V1.1'

          en="$(curl -fLsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/en)"
          tr="$(curl -fLsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/tr)"
          printf '%s' "$en" | grep -Fq 'rel="canonical" href="https://htmlandhtml.com/en"'
          printf '%s' "$en" | grep -Fq 'hreflang="tr" href="https://htmlandhtml.com/tr"'
          printf '%s' "$en" | grep -Fq 'hreflang="x-default" href="https://htmlandhtml.com/en"'
          printf '%s' "$tr" | grep -Fq 'rel="canonical" href="https://htmlandhtml.com/tr"'
          printf '%s' "$tr" | grep -Fq 'hreflang="en" href="https://htmlandhtml.com/en"'
          ! printf '%s%s' "$en" "$tr" | grep -Eq '\?lang=(en|tr)'
          printf '%s%s' "$en" "$tr" | grep -q '/assets/js/theme.js'
          pricing="$(curl -fLsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/en/pricing)"
          ! printf '%s' "$pricing" | grep -q '\$49\|\$99'
          printf '%s' "$pricing" | grep -q '\$149'

      - name: Verify machine-readable authority graph
        shell: bash
        run: |
          set -euo pipefail
          llms="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/llms.txt)"
          sitemap="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/sitemap.xml)"
          indexmd="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/index.md)"
          for marker in 'https://htmlandhtml.com/en/tools' 'https://htmlandhtml.com/tr/araclar' 'https://htmlandhtml.com/en/guides' 'https://htmlandhtml.com/tr/rehberler' 'AI Mention Tracker'; do printf '%s' "$llms" | grep -Fq "$marker"; done
          for marker in '/en/schema-validator' '/tr/schema-validator' '/en/guides/ai-crawler-access' '/tr/rehberler/ai-tarayici-erisimi'; do printf '%s' "$sitemap" | grep -Fq "$marker"; done
          printf '%s' "$indexmd" | grep -Fq 'HTML&HTML — AI Website Readiness'
          openapi="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/openapi.json)"
          profile="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/audit-profile.json)"
          sources="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/sources.json)"
          OPENAPI="$openapi" PROFILE="$profile" SOURCES="$sources" node - <<'NODE'
          const api=JSON.parse(process.env.OPENAPI), p=JSON.parse(process.env.PROFILE), s=JSON.parse(process.env.SOURCES);
          if(api.openapi!=='3.1.0') throw new Error('OpenAPI version');
          for(const x of ['/api/health','/api/scan','/api/mentions','/api/mandate']) if(!api.paths?.[x]) throw new Error('missing API path '+x);
          if(p.version!=='1.1.0'||p.engines?.length!==12) throw new Error('audit profile contract');
          if(p.scanBoundaries?.maxPublicHtmlPages!==50) throw new Error('Deep Crawl boundary');
          if(p.engines.reduce((a,x)=>a+x.overallWeight,0)!==100) throw new Error('audit weights');
          if(!Array.isArray(s.sources)||s.sources.length<8) throw new Error('source registry contract');
          NODE

      - name: Verify health contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/api/health)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          if(x.status!=='ok'||x.scanEngines!==12||x.maxPages!==50||x.freeDiagnosis!==true||x.aiMentionTracker!==true) throw new Error('health contract');
          NODE

      - name: Verify production 12-engine Deep Crawl contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 240 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/scan)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY); const expected=['crawl','technical','ai','llms','schema','performance','accessibility','security','trust','agent','conversion','links'];
          for(const k of expected) if(typeof x.scores?.[k] !== 'number') throw new Error('missing score '+k);
          if(!Array.isArray(x.findings)||!x.scanId||x.fieldData?.coreWebVitals!=='NOT_MEASURED'||Object.keys(x.scores).length!==12) throw new Error('scan contract');
          if((x.summary?.pagesScanned||0)>50) throw new Error('Deep Crawl exceeded 50-page boundary');
          for(const f of x.findings){ if(!f.id||!f.severity||!f.confidence||!f.sourceClass||!('evidence' in f)) throw new Error('finding evidence contract'); if('fixTr' in f||'fixEn' in f||'rootFix' in f) throw new Error('paid remediation leaked'); }
          NODE

      - name: Verify SSRF boundary repeats safely
        shell: bash
        run: |
          set -euo pipefail
          for target in 'http://127.0.0.1' 'http://localhost'; do
            code="$(curl -sS -o /tmp/ssrf.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data "{\"domain\":\"$target\"}" https://htmlandhtml.com/api/scan)"
            test "$code" = '403'
          done

      - name: Verify AI Mention Tracker paid boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/api/mentions)"
          STATUS="$status" node - <<'NODE'
          const x=JSON.parse(process.env.STATUS);
          if(x.service!=='htmlandhtml-ai-mention-tracker'||x.paidModule!==true||!x.providers) throw new Error('mention tracker status contract');
          NODE
          code="$(curl -sS -o /tmp/mentions.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"brand":"HTML&HTML","domain":"htmlandhtml.com","queries":["Which tools audit websites for AI search readiness?"]}' https://htmlandhtml.com/api/mentions)"
          case "$code" in 402|503) exit 0 ;; *) echo "Unexpected mention endpoint status: $code"; cat /tmp/mentions.json; exit 1 ;; esac

      - name: Verify paid mandate is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/mandate.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/mandate)"
          case "$code" in 402|503) exit 0 ;; *) echo "Unexpected paid endpoint status: $code"; cat /tmp/mandate.json; exit 1 ;; esac
