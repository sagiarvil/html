name: live-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production release and verify premium homepage
        shell: bash
        run: |
          set -euo pipefail
          ok=0; code=000; : > /tmp/headers; : > /tmp/body
          for i in {1..24}; do
            code="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' --connect-timeout 8 --max-time 20 https://htmlandhtml.com/ || true)"
            if test "$code" = '200' && grep -q 'AI &amp; LLM WEBSITE READINESS\|12 motor\|12 engines' /tmp/body && grep -q '\$149' /tmp/body; then ok=1; break; fi
            sleep 5
          done
          if test "$ok" -ne 1; then
            echo "PRODUCTION_BOUNDARY_FAILURE http=$code"
            echo '--- response headers ---'; sed -n '1,40p' /tmp/headers
            echo '--- public title ---'; grep -o -m1 '<title>[^<]*' /tmp/body || true
            echo '--- release markers ---'; grep -o -m6 'Premium HTML templates\|AI &amp; LLM WEBSITE READINESS\|12 motor\|12 engines\|\$49\|\$99\|\$149' /tmp/body || true
            exit 1
          fi
          ! grep -q '\$49\|\$99' /tmp/body
          grep -qi 'rel="describedby"' /tmp/body
          grep -qi 'type="text/markdown"' /tmp/body

      - name: Verify static docs and Markdown discovery
        shell: bash
        run: |
          set -euo pipefail
          for p in guide about api llms.txt guide.md about.md api.md; do
            code="$(curl -sS -o /tmp/page -w '%{http_code}' --connect-timeout 8 --max-time 20 "https://htmlandhtml.com/$p")"
            test "$code" = '200' || { echo "$p => $code"; exit 1; }
          done
          curl -fsSI https://htmlandhtml.com/guide | tr -d '\r' | grep -qi 'rel="alternate"; type="text/markdown"'
          curl -fsSI https://htmlandhtml.com/guide | tr -d '\r' | grep -qi 'rel="describedby"'

      - name: Verify health contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 8 --max-time 20 https://htmlandhtml.com/api/health)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          if(x.status!=='ok') throw new Error('health status');
          if(x.scanEngines!==12) throw new Error('engine count');
          if(x.freeDiagnosis!==true) throw new Error('free diagnosis contract');
          if(x.version!=='3.1.0') throw new Error('runtime version');
          if(x.llmsEngine?.version!=='2.0.0') throw new Error('formal llms engine version');
          if(x.llmsEngine?.spec!=='v2') throw new Error('llms spec');
          if(!x.standardsRegistry) throw new Error('standards registry');
          NODE

      - name: Verify formal llms API
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 90 'https://htmlandhtml.com/api/llms?url=https://htmlandhtml.com/guide')"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          if(x.present!==true) throw new Error('llms missing');
          if(x.spec?.version!=='v2') throw new Error('wrong spec');
          if(x.engine?.version!=='2.0.0') throw new Error('wrong llms engine');
          if(!x.response?.sha256 || x.response.sha256.length!==64) throw new Error('audit hash');
          if(x.ast?.h1!==1) throw new Error('h1 contract');
          if(typeof x.scores?.structure!=='number'||typeof x.scores?.links!=='number'||typeof x.scores?.quality!=='number') throw new Error('llms scores');
          if(!Array.isArray(x.links)||!Array.isArray(x.rules)) throw new Error('audit detail');
          NODE

      - name: Verify production 12-engine scan
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 10 --max-time 120 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com","fresh":true}' https://htmlandhtml.com/api/scan)"
          BODY="$body" node - <<'NODE'
          const x=JSON.parse(process.env.BODY);
          const expected=['crawl','technical','ai','llms','schema','performance','accessibility','security','trust','agent','conversion','links'];
          for(const k of expected) if(typeof x.scores?.[k] !== 'number') throw new Error('missing score '+k);
          if(Object.keys(x.scores).length!==12) throw new Error('score cardinality');
          if(!Array.isArray(x.findings)||!x.scanId) throw new Error('evidence contract');
          if(x.fieldData?.coreWebVitals!=='NOT_MEASURED') throw new Error('CWV evidence contract');
          if(x.engine?.version!=='3.1.0') throw new Error('orchestrator version');
          if(x.llmsAudit?.engine?.version!=='2.0.0') throw new Error('formal llms integration');
          for(const f of x.findings){
            if(!f.id||!f.severity||!f.confidence||!f.sourceClass||!('evidence' in f)) throw new Error('finding evidence contract');
            if('fixTr' in f||'fixEn' in f||'rootFix' in f||'rollback' in f) throw new Error('paid remediation leaked into free scan');
          }
          NODE

      - name: Verify SSRF boundary repeats safely
        shell: bash
        run: |
          set -euo pipefail
          for target in 'http://127.0.0.1' 'http://localhost'; do
            code="$(curl -sS -o /tmp/ssrf.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data "{\"domain\":\"$target\"}" https://htmlandhtml.com/api/scan)"
            test "$code" = '403' || { echo "SSRF target $target => $code"; cat /tmp/ssrf.json; exit 1; }
          done

      - name: Verify paid mandate is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/mandate.json -w '%{http_code}' --connect-timeout 8 --max-time 20 -H 'content-type: application/json' --data '{"domain":"htmlandhtml.com"}' https://htmlandhtml.com/api/mandate)"
          case "$code" in 402|503) exit 0 ;; *) echo "Unexpected paid endpoint status: $code"; cat /tmp/mandate.json; exit 1 ;; esac
