name: fix-input-once
on:
  push:
    branches: [ai-mention-dark-deep50-20260906-final]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', 'Remove protocol prefix from scanner input') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ai-mention-dark-deep50-20260906-final
          fetch-depth: 0
      - name: Remove visual protocol requirement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="field"><span>https://</span><input id="domainInput"'
          new='<div class="field"><input id="domainInput"'
          if old not in s:
              raise SystemExit('scanner prefix marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove protocol prefix from scanner input'
          git push origin HEAD:ai-mention-dark-deep50-20260906-final
