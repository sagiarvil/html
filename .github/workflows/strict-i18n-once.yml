          new="function applyLang(l){lang=l;document.documentElement.lang=l;localStorage.setItem('hh-lang',l);document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(D[l][k]!=null){if(htmlKeys.has(k))el.innerHTML=D[l][k];else el.textContent=D[l][k]}});document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.querySelectorAll('[data-locale-base]').forEach(a=>a.href=`/${l}/${a.dataset.localeBase}/`);document.querySelectorAll('[data-methodology-link]').forEach(a=>a.href=l==='tr'?'/tr/methodology/':'/methodology.html');document.title=l==='tr'?'HTML&HTML — 12 Motorlu Web Sitesi Düzeltme Doğrulayıcısı':'HTML&HTML — 12-Engine Website Fix Validator';const active=document.querySelector('.tabs button.active');if(input)input.placeholder=active?.dataset.mode==='url'?D[l].urlPlaceholder:D[l].domainPlaceholder;window.dispatchEvent(new CustomEvent('hh-language-changed',{detail:{lang:l}}))}"
          if old in s:s=s.replace(old,new)
          s=s.replace("input.placeholder=t.dataset.mode==='url'?'https://ornek.com/sayfa':'ornek.com'","input.placeholder=t.dataset.mode==='url'?D[lang].urlPlaceholder:D[lang].domainPlaceholder")
          s=s.replace("crawl:{tr:'Crawl & Index',en:'Crawl & Index'}","crawl:{tr:'Tarama ve İndeksleme',en:'Crawl & Index'}")
