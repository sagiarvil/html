            ('<article><strong>OFFICIAL / PROPOSAL / HEURISTIC</strong>','<article><strong data-i18n="evidenceClasses">RESMİ / ÖNERİ / SEZGİSEL</strong>'),
            ('<article><strong>FIELD DATA</strong>','<article><strong data-i18n="fieldDataLabel">SAHA VERİSİ</strong>'),
