            ('<div class="signals"><span>CRAWL</span><i></i><span>SEO</span><i></i><span>AI / GEO</span><i></i><span>LLMS V2</span><i></i><span>SCHEMA</span><i></i><span>A11Y</span><i></i><span>SECURITY</span></div>','<div class="signals"><span data-i18n="sigCrawl">TARAMA</span><i></i><span>SEO</span><i></i><span>AI / GEO</span><i></i><span>LLMS V2</span><i></i><span data-i18n="sigSchema">YAPISAL VERİ</span><i></i><span data-i18n="sigA11y">ERİŞİLEBİLİRLİK</span><i></i><span data-i18n="sigSecurity">GÜVENLİK</span></div>'),
