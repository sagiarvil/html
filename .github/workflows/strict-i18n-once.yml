          if 'const sourceNames=' not in s:
              helper="const sourceNames={tr:{OFFICIAL_STANDARD:'RESMİ STANDART',OFFICIAL_VENDOR:'RESMİ SAĞLAYICI',PROPOSAL:'ÖNERİ',MEASURED:'ÖLÇÜLMÜŞ',INTERNAL_HEURISTIC:'İÇ SEZGİSEL KURAL',EXPERIMENTAL:'DENEYSEL'},en:{OFFICIAL_STANDARD:'OFFICIAL STANDARD',OFFICIAL_VENDOR:'OFFICIAL VENDOR',PROPOSAL:'PROPOSAL',MEASURED:'MEASURED',INTERNAL_HEURISTIC:'INTERNAL HEURISTIC',EXPERIMENTAL:'EXPERIMENTAL'}};function sourceLabel(v){return sourceNames[lang]?.[v]||v}\n"
