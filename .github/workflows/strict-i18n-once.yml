            ('<a href="/tr/ai-website-readiness/">AI Website Readiness</a>','<a href="/tr/ai-website-readiness/" data-locale-base="ai-website-readiness" data-i18n="footerReadiness">AI Web Sitesi Hazırlığı</a>'),
            ('<a href="/tr/ai-mention-tracker/">AI Mention Tracker</a>','<a href="/tr/ai-mention-tracker/" data-locale-base="ai-mention-tracker" data-i18n="footerMentions">AI Marka Görünürlük Takibi</a>'),
            ('<a href="/methodology.html">Methodology</a>','<a href="/methodology.html" data-methodology-link data-i18n="footerMethod">Metodoloji</a>')
          ])

          # Main runtime dictionary + dynamic report localization.
          p='assets/js/validator.js'; s=read(p)
          if 'Object.assign(D.tr,{skip:' not in s:
              inject="""Object.assign(D.tr,{skip:'İçeriğe geç',kicker:'WEB SİTESİ DÜZELTME DOĞRULAYICISI / V2',sigCrawl:'TARAMA',sigSchema:'YAPISAL VERİ',sigA11y:'ERİŞİLEBİLİRLİK',sigSecurity:'GÜVENLİK',paidResolution:'ÜCRETLİ DÜZELTME',engine1:'Tarama ve İndeksleme',engine2:'Teknik SEO',engine3:'AI / GEO Erişimi',engine4:'llms.txt v2',engine5:'Yapısal Veri',engine6:'Performans Hijyeni',engine7:'Erişilebilirlik',engine8:'Güvenlik Temeli',engine9:'İçerik Güveni',engine10:'Ajan Hazırlığı',engine11:'Dönüşüm',engine12:'Bağlantı Bütünlüğü',evidenceConfirmed:'DOĞRULANMIŞ',evidenceProbable:'GÜÇLÜ / OLASI',evidenceClasses:'RESMİ / ÖNERİ / SEZGİSEL',fieldDataLabel:'SAHA VERİSİ',fullDiagnosis:'TAM TEŞHİS',fullFixProduct:'TAM SİTE DÜZELTME TALİMATI',footerLlms:'llms.txt Doğrulayıcı',footerCrawler:'AI Tarayıcı Kontrolü',footerReadiness:'AI Web Sitesi Hazırlığı',footerMentions:'AI Marka Görünürlük Takibi',footerMethod:'Metodoloji',domainPlaceholder:'ornek.com',urlPlaceholder:'https://ornek.com/sayfa',scanId:'Tarama Kimliği',pagesLabel:'Sayfalar',implementationLocked:'Uygulama talimatı Tam Site Düzeltme Talimatı içinde'});\nObject.assign(D.en,{skip:'Skip to content',kicker:'WEBSITE FIX VALIDATOR / V2',sigCrawl:'CRAWL',sigSchema:'STRUCTURED DATA',sigA11y:'ACCESSIBILITY',sigSecurity:'SECURITY',paidResolution:'PAID RESOLUTION',engine1:'Crawl & Index',engine2:'Technical SEO',engine3:'AI / GEO Access',engine4:'llms.txt v2',engine5:'Structured Data',engine6:'Performance Hygiene',engine7:'Accessibility',engine8:'Security Baseline',engine9:'Content Trust',engine10:'Agent Readiness',engine11:'Conversion',engine12:'Link Integrity',evidenceConfirmed:'CONFIRMED',evidenceProbable:'STRONG / PROBABLE',evidenceClasses:'OFFICIAL / PROPOSAL / HEURISTIC',fieldDataLabel:'FIELD DATA',fullDiagnosis:'FULL DIAGNOSIS',fullFixProduct:'FULL SITE FIX MANDATE',footerLlms:'llms.txt Validator',footerCrawler:'AI Crawler Checker',footerReadiness:'AI Website Readiness',footerMentions:'AI Mention Tracker',footerMe