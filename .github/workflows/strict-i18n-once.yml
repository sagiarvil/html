thod-item"><b>RESMİ STANDART</b><div><h3>Normatif standartlar ve protokoller</h3><p>Robots Exclusion Protocol gibi resmi veya normatif otoritesi olan kurallar.</p></div></div><div class="method-item"><b>RESMİ SAĞLAYICI</b><div><h3>Güncel sağlayıcı dokümantasyonu</h3><p>İlgili sistemi işleten kuruluşun birinci taraf yönlendirmesi. Davranış değişebileceği için kaynaklar yeniden doğrulanır.</p></div></div><div class="method-item"><b>ÖNERİ</b><div><h3>Gelişmekte olan öneriler</h3><p>llms.txt gibi yararlı ancak zorunlu web standardı olmayan uygulamalar.</p></div></div><div class="method-item"><b>ÖLÇÜLMÜŞ</b><div><h3>Doğrudan gözlem</h3><p>HTTP durumu, header, HTML, robots, schema parse durumu ve bağlantı yanıtı gibi dışarıdan ölçülen gerçekler.</p></div></div><div class="method-item"><b>İÇ SEZGİSEL KURAL</b><div><h3>Ürün karar kuralları</h3><p>Resmi eşik bulunmayan durumlarda kullanılan karar destek kuralları; hiçbir zaman standart gibi sunulmaz.</p></div></div><div class="method-item"><b>DENEYSEL</b><div><h3>Erken aşama ajan yüzeyleri</h3><p>Düşük benimsenmiş veya deneysel mekanizmalar olgun crawl/index gereksinimlerinden ayrı tutulur.</p></div></div></div></section><section class="section" id="confidence"><header><span class="eyebrow">02 / GÜVEN</span><h2>Her bulgu kendi kanıt gücünü taşır.</h2><p>Tarayıcı doğrudan gözlemleneni, güçlü olasılığı ve kaynak kod doğrulaması gereken durumu ayırır.</p></header><div class="authority-grid"><article class="authority-card"><b>DOĞRULANMIŞ</b><h3>Doğrudan ölçüldü</h3><p>Public yanıt koşulu doğrudan kanıtlar.</p></article><article class="authority-card"><b>GÜÇLÜ</b><h3>Birden fazla sinyal uyumlu</h3><p>Bağımsız public sinyaller aynı sonuca işaret eder.</p></article><article class="authority-card"><b>OLASI</b><h3>Yararlı fakat eksik</h3><p>Kanıt bulguyu destekler ancak iç mekanizmanın tamamını kanıtlamaz.</p></article><article class="authority-card"><b>KAYNAK DOĞRULAMASI GEREKİR</b><h3>Kod tabanı doğrulaması gerekli</h3><p>Public davranış sorun sınıfını gösterir; değişecek dosya veya fonksiyon uydurulmaz.</p></article></div></section><section class="section" id="scoring"><header><span class="eyebrow">03 / SKORLAMA</span><h2>Bilinmeyen, ne başarısızlık ne de başarıdır.</h2><p>Yalnız güvenilir biçimde ölçülebilen kurallar paydada yer alır. Ölçülemeyen sinyal zorla başarılı veya başarısız sayılmaz.</p></header><div class="comparison-wrap"><table class="comparison-table"><thead><tr><th>Durum</th><th>Paydaya dahil</th><th>Skor katkısı</th><th>Yorum</th></tr></thead><tbody><tr><td>BAŞARILI</td><td>Evet</td><td>Ağırlıklı geçiş</td><td>Ölçülen koşul sağlandı</td></tr><tr><td>BAŞARISIZ</td><td>Evet</td><td>0</td><td>Ölçülen koşul sağlanmadı</td></tr><tr><td>BİLİNMİYOR / ÖLÇÜLMEDİ</td><td>Hayır</td><td>Yok</td><td>Güvenilir kanıt yetersiz</td></tr></tbody></table></div></section><section class="section" id="boundaries"><header><span class="eyebrow">04 / SINIRLAR</span><h2>Tarayıcı bilinçli biçimde sınırlandırılmıştır.</h2><p>Üretim güvenliği ile kanıt güvenliği aynı metodolojinin parçasıdır.</p></header><div class="authority-grid"><article class="authority-card"><b>AĞ</b><h3>SSRF kapalı güvenlik yaklaşımı</h3><p>Private/local/reserved hedefler, credential içeren URL’ler, standart dışı portlar ve private ağa yönlenen redirect’ler reddedilir.</p></article><article class="authority-card"><b>TARAMA</b><h3>Sınırlandırılmış public tarama</h3><p>En fazla 50 public HTML sayfası; response boyutu, redirect derinliği, istek süresi ve link probe sayısı ayrıca sınırlandırılır.</p></article><article class="authority-card"><b>SAHA VERİSİ</b><h3>Uydurma Core Web Vitals yok</h3><p>LCP, INP ve CLS statik HTML’den tahmin edilmez; güvenilir entegrasyon yoksa ÖLÇÜLMEDİ kalır.</p></article><article class="authority-card"><b>KAYNAK KOD</b><h3>Dosya yolu uydurulmaz</h3><p>Kesin dosya hedefi için repository/kod tabanı bağlamı gerekir.</p></article><article class="authority-card"><b>TİCARİ AYRIM</b><h3>Kanıt ücretsiz kalır</h3><p>Bulgu, URL, önem, güven, kaynak sınıfı ve kanıt açıktır; ücretli katman uygulama sırası, kök düzeltme, test ve geri alma sözleşmesini satar.</p></article><article class="authority-card"><b>ERİŞİM HAKKI</b><h3>Ücretli uç nokta kapalı güvenlik yaklaşımıyla çalışır</h3><p>Ödeme altyapısı doğru kurulmadan ücretli çıktı public hale gelmez.</p></article></div></section><section class="section" id="governance"><header><span class="eyebrow">05 / YÖNETİŞİM</span><h2>Dış kurallar ezberlenmez; yeniden doğrulanır.</h2><p>Sağlayıcı crawler adları, politikaları ve gelişmekte olan öneriler değişebilir. Kaynak güncelliği kural setinin bağımlılığıdır.</p></header><div class="authority-callout"><div><h3>Metodolojiyi gerçek bir alan adında çalıştırın.</h3><p>Public tarayıcı ölçülen sonuç ve kanıtı verir; özel araç sayfaları aynı 12 motoru farklı karar yüzeylerinde gösterir.</p></div><a href="/?lang=tr#scanner">12 motoru çalıştır</a></div></section></main><footer><div><a class="brand" href="/?lang=tr"><span class="brand-box">H&amp;H</span><span>HTML&amp;HTML</span></a><div class="authority-footer-links"><a href="/tr/llms-txt-validator/">llms.txt Doğrulayıcı</a><a href="/tr/ai-crawler-checker/">AI Tarayıcı Kontrolü</a><a href="/tr/ai-website-readiness/">AI Web Sitesi Hazırlığı</a><a href="/tr/ai-mention-tracker/">AI Marka Görünürlük Takibi</a></div></div><small>Metodoloji sürümü 2.0 · 2026-09-06 · © HTML&amp;HTML</small></footer></body></html>''')

          # Guard against future mixed-language regressions and unreadably tiny report text.
          Path('tests/integrity/i18n.mjs').write_text(r'''import fs from 'node:fs';
          const read=p=>fs.readFileSync(p,'utf8');const errors=[];
          const main=read('index.html'),js=read('assets/js/validator.js'),theme=read('assets/js/theme.js'),css=read('assets/css/validator.css'),auth=read('assets/css/authority.css');
          for(const key of ['skip','kicker','paidResolution','engine1','engine12','fullDiagnosis','fullFixProduct','footerMethod'])if(!main.includes(`data-i18n="${key}"`))errors.push(`main missing ${key}`);
          for(const token of ["domainPlaceholder:'ornek.com'","urlPlaceholder:'https://ornek.com/sayfa'","domainPlaceholder:'example.com'","urlPlaceholder:'https://example.com/page'",'sourceLabel(f.sourceClass)','D[lang].scanId','D[lang].implementationLocked'])if(!js.includes(token))errors.push(`validator locale contract missing ${token}`);
          if(!theme.includes('hh-language-changed'))errors.push('theme switch does not relabel on language change');
          for(const token of ['.finding p{font-size:15px!important','.finding code{font-size:13px!important','.scan-disclosure{font-size:14px!important','.tool-finding p{font-size:14px','.mention-row p{font-size:14px'])if(!(css+auth).includes(token))errors.push(`readability contract missing ${token}`);
          const trFiles=['tr/llms-txt-validator/index.html','tr/ai-crawler-checker/index.html','tr/ai-website-readiness/index.html','tr/ai-mention-tracker/index.html'];
          const bannedTr=['>Validator<','>Checker<','>Tracker<','>AI Readiness<','>Methodology<','>Neutral prompt guard<','>Brand mention<','>Domain citation<','>Provider-by-provider evidence<','Evidence is free. Implementation precision is the product.'];
          for(const p of trFiles){const s=read(p);for(const x of bannedTr)if(s.includes(x))errors.push(`${p}: English UI leak ${x}`);if(!s.includes('href="/tr/methodology/"'))errors.push(`${p}: Turkish methodology route missing`)}
          if(!fs.existsSync('tr/methodology/index.html'))errors.push('Turkish methodology page missing');
          const checkout=read('checkout.html');for(const k of ['data-k="product"','data-k="c2"','data-k="c3"','data-k="c4"'])if(!checkout.includes(k))errors.push(`checkout i18n missing ${k}`);
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}console.log('Strict bilingual UI and readability contract OK');''')

          pkg=json.loads(read('package.json'))
          pkg['scripts']['test:integrity']='node tests/integrity/check.mjs && node tests/integrity/authority.mjs && node tests/integrity/i18n.mjs'
          pkg['scripts']['test:client']='node --check assets/js/validator.js && node --check assets/js/authority-tool.js && node --check assets/js/theme.js && node --check assets/js/mention-tracker.js'
          write('package.json',json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
