name: strict-i18n-once
on:
  push:
    branches: [strict-full-i18n-20260906]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply strict bilingual UI and readability') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: strict-full-i18n-20260906
          fetch-depth: 0
      - name: Apply strict bilingual UI and readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def replace_all(p,repls):
              s=read(p)
              for a,b in repls:
                  if a in s: s=s.replace(a,b)
              write(p,s)

          # Readability on main + result reports. Headings stay unchanged.
          p='assets/css/validator.css'; s=read(p)
          if '/* READABILITY_V3 */' not in s:
              s += '''\n/* READABILITY_V3 */\nbody{line-height:1.55}.hero>p{font-size:19px;line-height:1.75;max-width:760px}.scanbox small{font-size:13px;line-height:1.55;margin-top:14px}.section{padding-top:124px;padding-bottom:124px}.section>header{margin-bottom:68px}.section>header>p{font-size:17px;line-height:1.75;max-width:760px;margin-top:14px}.result-head p{font-size:15px;line-height:1.55}.score-item{padding:22px 18px}.score-item span{font-size:12px;line-height:1.35}.score-item strong{font-size:32px;margin-top:8px}.scan-disclosure{font-size:14px!important;line-height:1.55!important;padding:15px 17px!important}.result-title{margin-bottom:18px}.result-title h3{font-size:24px}.result-title span{font-size:14px}.finding{padding:24px 0!important;gap:18px!important}.severity{font-size:12px!important;line-height:1.4}.finding-tags{gap:8px!important;margin-bottom:10px!important}.finding-tags span{font-size:11px!important;line-height:1.35;padding:5px 8px!important}.finding h4{font-size:17px!important;line-height:1.4;margin-bottom:10px!important}.finding p{font-size:15px!important;line-height:1.7!important}.finding-url{font-size:13px;line-height:1.5}.finding code{font-size:13px!important;line-height:1.6!important;padding:11px 12px!important;margin-top:10px!important}.locked-fix{font-size:12px!important;line-height:1.5!important;padding:11px 12px!important}.engine-grid article{padding-top:30px;padding-bottom:30px;min-height:198px}.engine-grid h3{margin-top:22px;margin-bottom:12px}.engine-grid p,.evidence-grid p,.feature-grid p{font-size:15px;line-height:1.72}.evidence-grid article{padding:24px;min-height:188px}.how li{padding:36px 0}.how h3{margin-bottom:10px}.how p{font-size:16px;line-height:1.7}.mandate-card>p{font-size:15px;line-height:1.68}.mandate-card li{font-size:13px;line-height:1.5;padding:12px 0}.pricing-grid article>p{font-size:14px;line-height:1.68}.pricing-grid li{font-size:13px;line-height:1.5;padding:12px 0}.compare p{font-size:14px;line-height:1.7}.faq details p{font-size:16px;line-height:1.75}.footerlinks a{font-size:14px}footer>div:first-child p{font-size:14px;line-height:1.65}@media(max-width:600px){.hero>p{font-size:17px;line-height:1.72}.section{padding-top:78px;padding-bottom:78px}.section>header>p,.how p,.faq details p{font-size:15px}.engine-grid p,.evidence-grid p,.feature-grid p{font-size:14px}.score-item span{font-size:11px}.scan-disclosure{font-size:13px!important}.finding h4{font-size:16px!important}.finding p{font-size:14px!important}.finding code{font-size:12px!important}}\n'''
              write(p,s)

          p='assets/css/authority.css'; s=read(p)
          if '/* READABILITY_V3 */' not in s:
              s += '''\n/* READABILITY_V3 */\n.authority-hero>p{font-size:19px;line-height:1.75}.authority-proof{margin-top:34px;gap:12px}.authority-proof span{font-size:12px;padding:9px 12px}.tool-panel{padding:34px}.tool-panel>p{font-size:16px;line-height:1.72;margin-bottom:26px}.tool-note{font-size:13px;line-height:1.55;margin-top:13px}.tool-status{font-size:14px;line-height:1.55;padding:13px 15px}.tool-score span{font-size:14px;line-height:1.45}.tool-finding{padding:18px}.tool-finding header{gap:14px}.tool-finding b{font-size:15px;line-height:1.4}.tool-finding small{font-size:11px;line-height:1.4}.tool-finding p{font-size:14px;line-height:1.68;margin-top:9px}.tool-finding code{font-size:12px;line-height:1.6;padding:10px}.authority-grid{gap:16px}.authority-card{padding:28px;min-height:248px}.authority-card h3{margin-top:22px;margin-bottom:12px}.authority-card p{font-size:15px;line-height:1.72}.authority-card a{font-size:13px}.comparison-table th,.comparison-table td{padding:18px 20px;font-size:14px;line-height:1.5}.comparison-table th{font-size:11px}.authority-callout{padding:36px}.authority-callout p{font-size:16px;line-height:1.7}.authority-callout a{font-size:13px}.method-item{padding:30px 0}.method-item h3{margin-bottom:10px}.method-item p{font-size:15px;line-height:1.72}.authority-footer-links{gap:18px;font-size:14px}.mention-results{display:grid;gap:14px}.mention-row{border:1px solid #35362f;border-radius:14px;padding:18px;background:#171814}.mention-row header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.mention-row header b{font-size:15px;line-height:1.4}.mention-row header small{display:block;font-size:12px;line-height:1.5;margin-top:4px}.mention-row p{font-size:14px;line-height:1.7}.mention-row>small{font-size:12px;line-height:1.6}.mention-badge{font-size:11px;font-weight:900;letter-spacing:.06em;padding:6px 8px;border-radius:999px}@media(max-width:600px){.authority-hero>p{font-size:17px}.tool-panel{padding:24px 18px}.tool-panel>p,.authority-callout p{font-size:15px}.authority-card p,.method-item p{font-size:14px}.tool-finding b{font-size:14px}.tool-finding p,.mention-row p{font-size:13px}}\n'''
              write(p,s)

