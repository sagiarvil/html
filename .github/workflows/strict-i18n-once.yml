            ('<article><b>06</b><h3>Performance Hygiene</h3>','<article><b>06</b><h3 data-i18n="engine6">Performans Hijyeni</h3>'),
            ('<article><b>07</b><h3>Accessibility</h3>','<article><b>07</b><h3 data-i18n="engine7">Erişilebilirlik</h3>'),
            ('<article><b>08</b><h3>Security Baseline</h3>','<article><b>08</b><h3 data-i18n="engine8">Güvenlik Temeli</h3>'),
            ('<article><b>09</b><h3>Content Trust</h3>','<article><b>09</b><h3 data-i18n="engine9">İçerik Güveni</h3>'),
            ('<article><b>10</b><h3>Agent Readiness</h3>','<article><b>10</b><h3 data-i18n="engine10">Ajan Hazırlığı</h3>'),
            ('<article><b>11</b><h3>Conversion</h3>','<article><b>11</b><h3 data-i18n="engine11">Dönüşüm</h3>'),
