name: llms-news-readiness-check

on:
  push:
    branches:
      - paddle-saas-readiness-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llms-news-readiness-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: paddle-saas-readiness-20260906
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current readiness transforms in workspace
        run: |
          python3 scripts/prepare_paddle_saas.py
          python3 scripts/patch_paddle_nav.py
      - name: Run real LLMS.TXT News discovery + editorial health check
        env:
          NEWS_EDITORIAL_OPENAI_KEY: ${{ secrets.NEWS_EDITORIAL_OPENAI_KEY }}
          NEWS_EDITORIAL_MODEL: gpt-5.6-luna
        run: python3 scripts/update_llms_news.py --require-editorial-key
      - name: Materialize bilingual news pages
        run: python3 scripts/build_llms_news.py
      - name: Validate editorial, SEO and source-boundary contract
        run: node tests/integrity/llms-news.test.mjs
