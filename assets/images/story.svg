<svg width="600" height="338" viewBox="0 0 600 338" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="story_hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a085"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="600" height="338" fill="#FFFFFF"/>
  <rect width="600" height="24" fill="#E1E4E8"/>
  <circle cx="16" cy="12" r="4" fill="#FF5F56"/>
  <circle cx="28" cy="12" r="4" fill="#FFBD2E"/>
  <circle cx="40" cy="12" r="4" fill="#27C93F"/>
  
  <!-- Story Split Screen Layout (Exact Style) -->
  <g transform="translate(30, 45)">
    <!-- Left Hero -->
    <rect x="0" y="0" width="260" height="265" rx="4" fill="url(#story_hero)"/>
    <text x="30" y="80" fill="#FFFFFF" font-family="'Source Sans Pro', sans-serif" font-size="28" font-weight="900">STORY</text>
    <text x="30" y="105" fill="#e7746f" font-family="sans-serif" font-size="12" font-weight="bold">BY HTML&amp;HTML</text>
    <rect x="30" y="130" width="180" height="6" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="30" y="145" width="140" height="6" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="30" y="180" width="110" height="28" rx="4" fill="#FFFFFF"/>
    <text x="50" y="198" fill="#16a085" font-family="sans-serif" font-size="11" font-weight="bold">DISCOVER</text>

    <!-- Right Story Sections -->
    <rect x="280" y="0" width="260" height="125" rx="4" fill="#F4F5F7" stroke="#DEE0E3"/>
    <text x="300" y="35" fill="#3b3f48" font-family="sans-serif" font-size="14" font-weight="bold">CHAPTER ONE: GENESIS</text>
    <rect x="300" y="50" width="220" height="6" rx="2" fill="#C4C9D2"/>
    <rect x="300" y="62" width="200" height="6" rx="2" fill="#C4C9D2"/>
    <rect x="300" y="74" width="180" height="6" rx="2" fill="#C4C9D2"/>
    <text x="300" y="105" fill="#e7746f" font-family="sans-serif" font-size="11" font-weight="bold">READ MORE →</text>

    <rect x="280" y="140" width="260" height="125" rx="4" fill="#F4F5F7" stroke="#DEE0E3"/>
    <text x="300" y="175" fill="#3b3f48" font-family="sans-serif" font-size="14" font-weight="bold">CHAPTER TWO: HORIZON</text>
    <rect x="300" y="190" width="220" height="6" rx="2" fill="#C4C9D2"/>
    <rect x="300" y="202" width="200" height="6" rx="2" fill="#C4C9D2"/>
    <rect x="300" y="214" width="180" height="6" rx="2" fill="#C4C9D2"/>
    <text x="300" y="245" fill="#e7746f" font-family="sans-serif" font-size="11" font-weight="bold">READ MORE →</text>
  </g>
</svg>
