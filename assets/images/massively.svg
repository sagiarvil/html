      <stop offset="0%" stop-color="#181A1F"/>
      <stop offset="100%" stop-color="#242831"/>
    </linearGradient>
    <linearGradient id="hero_art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#9b59b6"/>
