  <text x="70" y="176" fill="#e7746f" font-family="sans-serif" font-size="10" font-weight="bold">THIS IS MASSIVELY</text>
  <text x="190" y="176" fill="#FFFFFF" font-family="sans-serif" font-size="10">GENERIC PAGE</text>
  <text x="290" y="176" fill="#FFFFFF" font-family="sans-serif" font-size="10">ELEMENTS REFERENCE</text>

  <!-- Featured Article Card -->
  <rect x="40" y="195" width="520" height="130" rx="4" fill="#FFFFFF" stroke="#DEE0E3"/>
  <rect x="55" y="210" width="180" height="100" rx="3" fill="url(#hero_art)"/>
  
  <text x="255" y="228" fill="#e7746f" font-family="sans-serif" font-size="10" font-weight="bold">APRIL 24, 2026</text>
