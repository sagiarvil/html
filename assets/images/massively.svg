  <rect x="255" y="265" width="280" height="6" rx="2" fill="#DEE0E3"/>
  <rect x="255" y="277" width="240" height="6" rx="2" fill="#DEE0E3"/>
  <rect x="255" y="295" width="85" height="20" rx="3" fill="#676d79"/>
