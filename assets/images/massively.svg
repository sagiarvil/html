  </defs>
  <!-- Browser Frame -->
  <rect width="600" height="338" fill="#F4F5F7"/>
  <!-- Top Bar -->
  <rect width="600" height="24" fill="#E1E4E8"/>
  <circle cx="16" cy="12" r="4" fill="#FF5F56"/>
  <circle cx="28" cy="12" r="4" fill="#FFBD2E"/>
  <circle cx="40" cy="12" r="4" fill="#27C93F"/>
  <rect x="60" y="6" width="300" height="12" rx="3" fill="#FFFFFF"/>
  
  <!-- Website Header & Hero (Massively Style) -->
  <rect x="0" y="24" width="600" height="160" fill="url(#bg_massively)"/>
  <text x="300" y="70" text-anchor="middle" fill="#FFFFFF" font-family="'Source Sans Pro', serif" font-size="28" font-weight="900" letter-spacing="2">THIS IS MASSIVELY</text>
  <text x="300" y="95" text-anchor="middle" fill="#A0B2D6" font-family="sans-serif" font-size="12">A RESPONSIVE SITE TEMPLATE DESIGNED FOR CONTENT CREATORS</text>
  
  <rect x="250" y="115" width="100" height="26" rx="3" fill="#e7746f"/>
  <text x="300" y="132" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">EXPLORE MORE</text>

