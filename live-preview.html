<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Live Preview — HTML&HTML</title>
  <script src="assets/js/products.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dfe2df;color:#151916}body{display:flex;min-height:100vh;flex-direction:column}.lp-bar{min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:10px 18px;background:#101512;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}.lp-brand{display:flex;align-items:center;gap:14px;min-width:0}.lp-brandmark{font-family:Georgia,serif;font-size:.9rem;letter-spacing:.08em}.lp-title{min-width:0}.lp-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}.lp-title span{display:block;margin-top:2px;color:rgba(255,255,255,.53);font-size:.62rem}.lp-devices{display:flex;gap:5px;padding:4px;border:1px solid rgba(255,255,255,.13);border-radius:999px}.lp-devices button{min-height:32px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.68);font:inherit;font-size:.65rem;font-weight:760;cursor:pointer}.lp-devices button[aria-pressed=true]{background:#fff;color:#101512}.lp-actions{display:flex;justify-content:flex-end;gap:7px}.lp-action{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.17);border-radius:999px;color:#fff;text-decoration:none;font-size:.65rem;font-weight:760;white-space:nowrap}.lp-action.primary{background:#fff;color:#101512;border-color:#fff}.lp-action[aria-disabled=true]{opacity:.55;pointer-events:none}.lp-proof{padding:13px 18px;background:#f8f8f4;border-bottom:1px solid #cfd3cf}.lp-proof-top{display:flex;justify-content:space-between;gap:24px;align-items:center}.lp-summary strong{font-size:.78rem}.lp-summary span{display:block;margin-top:2px;color:#6c746d;font-size:.66rem}.lp-meta{display:flex;gap:16px;color:#636b64;font-size:.64rem}.lp-meta b{color:#1e2520}.lp-pages{display:flex;gap:6px;margin-top:10px;overflow:auto;padding-bottom:1px}.lp-pages button{flex:0 0 auto;min-height:35px;padding:0 12px;border:1px solid #d5dad5;border-radius:999px;background:#fff;color:#3f4741;font:inherit;font-size:.66rem;font-weight:770;cursor:pointer}.lp-pages button[aria-pressed=true]{background:#173f33;color:#fff;border-color:#173f33}.lp-stage{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:22px;overflow:auto;background:radial-gradient(circle at 50% 0,#eef0ed,#d9ddd9 72%)}#previewFrame{display:block;width:100%;height:calc(100vh - 176px);min-height:650px;border:0;background:#fff;box-shadow:0 28px 80px rgba(15,28,20,.18);transition:width .28s ease;border-radius:2px}@media(max-width:900px){.lp-bar{grid-template-columns:1fr auto}.lp-devices{grid-row:2;grid-column:1/-1;justify-self:center}.lp-proof-top{align-items:flex-start;flex-direction:column;gap:6px}.lp-stage{padding:10px}#previewFrame{height:calc(100vh - 230px);min-height:600px}}@media(max-width:620px){.lp-bar{display:flex;flex-wrap:wrap}.lp-brand{flex:1}.lp-brandmark{display:none}.lp-actions{width:100%;justify-content:flex-start;overflow:auto}.lp-devices{order:3;width:100%;overflow:auto;justify-content:flex-start}.lp-meta{display:none}.lp-stage{padding:0}#previewFrame{min-height:650px;box-shadow:none}}@media(prefers-reduced-motion:reduce){#previewFrame{transition:none}}
  </style>
</head>
<body>
  <header class="lp-bar">
    <div class="lp-brand"><a class="lp-brandmark" href="/">HTML&HTML</a><div class="lp-title"><strong id="previewTitle">Template preview</strong><span id="releaseLine">Actual rendered source</span></div></div>
    <div class="lp-devices" aria-label="Preview device"><button type="button" data-width="100%" aria-pressed="true">Desktop</button><button type="button" data-width="1024px" aria-pressed="false">Laptop</button><button type="button" data-width="768px" aria-pressed="false">Tablet</button><button type="button" data-width="390px" aria-pressed="false">Mobile</button></div>
    <div class="lp-actions"><a class="lp-action" href="/">Catalog</a><a class="lp-action" id="detailsLink" href="product.html">Product details</a><a class="lp-action" id="popoutLink" href="#" target="_blank" rel="noopener">Open page ↗</a><a class="lp-action primary" id="buyLink" href="#">Price</a></div>
  </header>
  <section class="lp-proof" id="previewProof" aria-label="Package scope"><div class="lp-proof-top"><div class="lp-summary"><strong id="packageSummary"></strong><span id="previewNote">Every tab below opens an HTML layout represented by the package.</span></div><div class="lp-meta"><span>Viewing: <b id="includedFile">index.html</b></span><span>Version: <b id="versionText">—</b></span><span>Status: <b id="statusText">—</b></span></div></div><div class="lp-pages" id="previewPages" role="group" aria-label="Included page previews"></div></section>
  <main class="lp-stage"><iframe id="previewFrame" title="Rendered HTML template preview"></iframe></main>
  <script>
    (() => {
      const products = window.HTMLHTML_PRODUCTS || {};
      const params = new URLSearchParams(location.search);
      const key = params.get('template') || 'habitat';
      const product = products[key] || products.habitat || Object.values(products)[0];
      if (!product) return;
      const frame = document.getElementById('previewFrame');
      const pagesRoot = document.getElementById('previewPages');
      const includedFile = document.getElementById('includedFile');
      const popout = document.getElementById('popoutLink');
      const details = document.getElementById('detailsLink');
      const buy = document.getElementById('buyLink');
      document.getElementById('previewTitle').textContent = `${product.title} · ${product.category}`;
      document.getElementById('releaseLine').textContent = `${product.releaseState || 'Preview'} · planned $${product.price}`;
      document.getElementById('packageSummary').textContent = product.summary || `${product.pages?.length || 1} HTML page`;
      document.getElementById('previewNote').textContent = product.previewNote || 'The live preview renders the source layout represented by this product.';
      document.getElementById('versionText').textContent = product.version || '—';
      document.getElementById('statusText').textContent = product.releaseState || 'Preview';
      details.href = `product.html?template=${encodeURIComponent(key)}`;
      const pages = Array.isArray(product.pages) && product.pages.length ? product.pages : [{label:'Main page',file:product.demo,includedAs:'index.html'}];
      const loadPage = (page, button) => {
        frame.src = page.file; popout.href = page.file; includedFile.textContent = page.includedAs || page.label;
        pagesRoot.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed','false'));
        button?.setAttribute('aria-pressed','true');
      };
      pages.forEach((page,index) => { const button=document.createElement('button'); button.type='button'; button.textContent=page.label; button.setAttribute('aria-pressed',String(index===0)); button.addEventListener('click',()=>loadPage(page,button)); pagesRoot.appendChild(button); });
      loadPage(pages[0], pagesRoot.querySelector('button'));
      if (product.purchaseReady) { buy.href=`checkout.html?package=${encodeURIComponent(key)}&price=${product.price}`; buy.textContent=`Buy · $${product.price}`; }
      else { buy.textContent=`$${product.price} · ${product.releaseState || 'Pending'}`; buy.setAttribute('aria-disabled','true'); }
      document.title = `${product.title} Live Preview — HTML&HTML`;
      document.querySelectorAll('.lp-devices button').forEach(button => button.addEventListener('click',()=>{ document.querySelectorAll('.lp-devices button').forEach(item=>item.setAttribute('aria-pressed','false')); button.setAttribute('aria-pressed','true'); frame.style.width=button.dataset.width; }));
    })();
  </script>
</body>
</html>
