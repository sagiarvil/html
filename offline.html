<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çevrimdışı — HTML&amp;HTML</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#14151a">
<style>
  body {
    margin: 0;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #14151a;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    box-sizing: border-box;
    text-align: center;
  }
  .card {
    max-width: 480px;
    background: #1c1e24;
    border: 1px solid #2e323b;
    border-radius: 12px;
    padding: 2.5rem 2rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #fff; }
  p { font-size: 0.95rem; line-height: 1.6; color: #9ca3af; margin-bottom: 1.5rem; }
  .btn {
    display: inline-block;
    min-height: 48px;
    min-width: 48px;
    padding: 0.75rem 1.5rem;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Çevrimdışı Mod (Offline)</h1>
  <p>Şu anda internet bağlantınız bulunmuyor. Bağlantınız kurulduğunda sayfa otomatik olarak yenilenecektir.</p>
  <a class="btn" href="javascript:window.location.reload()">Yeniden Dene</a>
</div>
</body>
</html>
